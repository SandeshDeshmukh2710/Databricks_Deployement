resources:
  jobs:
    qa_model_validation:
      name: "[${bundle.target}] QA Model Validation"

      tasks:
        - task_key: validate_qa_model
          spark_python_task:
            python_file: ../src/model_validation.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "xgboost"