resources:
  jobs:
    test_ml_job:
      name: "[${bundle.target}] Test ML Job"

      tasks:
        - task_key: hello_databricks

          spark_python_task:
            python_file: ../src/hello_databricks.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"